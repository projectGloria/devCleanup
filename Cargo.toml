[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
devclean-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size + speed: one codegen unit + fat LTO lets LLVM inline across crates,
# strip drops debug symbols, abort removes unwinding tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
