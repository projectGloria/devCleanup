name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); defaults to version in tauri.conf.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tauriConf = Get-Content -Raw "app/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $confVersion = $tauriConf.version

          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "v$confVersion"
          }

          $version = $tag.TrimStart("v")
          if ($version -ne $confVersion) {
            throw "Tag version '$version' does not match app/src-tauri/tauri.conf.json version '$confVersion'."
          }

          $prerelease = if ($version.Contains("-")) { "true" } else { "false" }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $tag (version=$version, prerelease=$prerelease)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install and build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build CLI release binary
        run: cargo build --release -p devclean

      - name: Build desktop GUI
        working-directory: app
        run: npx tauri build --no-bundle

      - name: Stage release artifacts and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $outDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "target/release/devclean-app.exe" -Destination "$outDir/devclean-app-${version}-x64.exe"
          Copy-Item "target/release/devclean.exe" -Destination "$outDir/devclean-${version}-x64.exe"

          $checksums = Get-ChildItem -Path $outDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path "$outDir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$outDir/SHA256SUMS.txt"

          # Only the runtime file goes into the GloriaSetup payload.
          New-Item -ItemType Directory -Force -Path app-dist | Out-Null
          Copy-Item "target/release/devclean-app.exe" -Destination "app-dist/devclean-app.exe"

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @($tag, "--title", "devClean ${{ steps.meta.outputs.version }}", "--generate-notes")
            if ("${{ steps.meta.outputs.prerelease }}" -eq "true") { $createArgs += "--prerelease" }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          }

      - name: Upload standalone executables and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem release-assets -File).FullName
          gh release upload "${{ steps.meta.outputs.tag }}" @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }

      - name: Pack and attach GloriaSetup installer
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          version: ${{ steps.meta.outputs.version }}
          release-tag: ${{ steps.meta.outputs.tag }}
          upload: "true"
          webview2-bootstrapper: MicrosoftEdgeWebview2Setup.exe
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
