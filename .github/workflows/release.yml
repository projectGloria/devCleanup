name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); defaults to version in tauri.conf.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tauriConf = Get-Content -Raw "app/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $confVersion = $tauriConf.version

          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "v$confVersion"
          }

          $version = $tag.TrimStart("v")
          if ($version -ne $confVersion) {
            throw "Tag version '$version' does not match app/src-tauri/tauri.conf.json version '$confVersion'."
          }

          $prerelease = if ($version.Contains("-")) { "true" } else { "false" }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $tag (version=$version, prerelease=$prerelease)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install and build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build CLI release binary
        run: cargo build --release -p devclean

      - name: Build desktop GUI and NSIS installer
        working-directory: app
        run: npx tauri build --bundles nsis

      - name: Stage release artifacts and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $outDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found in target/release/bundle/nsis"
          }
          Copy-Item $installer.FullName -Destination "$outDir/devClean_${version}_x64-setup.exe"
          Copy-Item "target/release/devclean-app.exe" -Destination "$outDir/devclean-app-${version}-x64.exe"
          Copy-Item "target/release/devclean.exe" -Destination "$outDir/devclean-${version}-x64.exe"

          $checksums = Get-ChildItem -Path $outDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path "$outDir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$outDir/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: devClean ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/devClean_${{ steps.meta.outputs.version }}_x64-setup.exe
            release-assets/devclean-app-${{ steps.meta.outputs.version }}-x64.exe
            release-assets/devclean-${{ steps.meta.outputs.version }}-x64.exe
            release-assets/SHA256SUMS.txt
