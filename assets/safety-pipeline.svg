<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .step-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #2dd4bf; }
    .arrow { stroke: #30363d; stroke-width: 2; stroke-dasharray: 4 2; }
    .arrow-head { fill: #2dd4bf; }
  </style>

  <!-- Step 1 -->
  <g transform="translate(10, 20)" filter="url(#shadow)">
    <rect width="155" height="210" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#2dd4bf"/>
    <circle cx="28" cy="34" r="14" fill="#2dd4bf" fill-opacity="0.15"/>
    <text x="28" y="38" text-anchor="middle" class="step-badge">01</text>
    <text x="50" y="38" class="step-title">Pattern Match</text>
    <text x="14" y="70" class="step-desc">Identifies candidate folder</text>
    <text x="14" y="86" class="step-desc">names from rules.toml:</text>
    <rect x="14" y="100" width="127" height="92" rx="6" fill="#1c2128"/>
    <text x="22" y="122" font-family="monospace" font-size="11" fill="#7ee787">node_modules/</text>
    <text x="22" y="142" font-family="monospace" font-size="11" fill="#79c0ff">target/</text>
    <text x="22" y="162" font-family="monospace" font-size="11" fill="#d2a8ff">.venv/, bin/obj</text>
    <text x="22" y="180" font-family="monospace" font-size="11" fill="#ffa657">Library, build...</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 168 125 L 182 125" class="arrow"/>
  <polygon points="182,121 188,125 182,129" class="arrow-head"/>

  <!-- Step 2 -->
  <g transform="translate(185, 20)" filter="url(#shadow)">
    <rect width="155" height="210" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#388bfd"/>
    <circle cx="28" cy="34" r="14" fill="#388bfd" fill-opacity="0.15"/>
    <text x="28" y="38" text-anchor="middle" class="step-badge" style="fill:#58a6ff;">02</text>
    <text x="50" y="38" class="step-title">Marker Proof</text>
    <text x="14" y="70" class="step-desc">Requires co-located</text>
    <text x="14" y="86" class="step-desc">manifest or project file:</text>
    <rect x="14" y="100" width="127" height="92" rx="6" fill="#1c2128"/>
    <text x="22" y="122" font-family="monospace" font-size="11" fill="#e6edf3">package.json</text>
    <text x="22" y="142" font-family="monospace" font-size="11" fill="#e6edf3">Cargo.toml</text>
    <text x="22" y="162" font-family="monospace" font-size="11" fill="#e6edf3">*.csproj / *.sln</text>
    <text x="22" y="180" font-family="monospace" font-size="11" fill="#e6edf3">pyproject.toml</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 343 125 L 357 125" class="arrow"/>
  <polygon points="357,121 363,125 357,129" class="arrow-head"/>

  <!-- Step 3 -->
  <g transform="translate(360, 20)" filter="url(#shadow)">
    <rect width="155" height="210" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#a371f7"/>
    <circle cx="28" cy="34" r="14" fill="#a371f7" fill-opacity="0.15"/>
    <text x="28" y="38" text-anchor="middle" class="step-badge" style="fill:#bc8cff;">03</text>
    <text x="50" y="38" class="step-title">Git-Ignore Proof</text>
    <text x="14" y="70" class="step-desc">Validated in-process via</text>
    <text x="14" y="86" class="step-desc">Rust `ignore` engine:</text>
    <rect x="14" y="100" width="127" height="92" rx="6" fill="#1c2128"/>
    <text x="22" y="124" class="step-desc" font-weight="600" fill="#3fb950">&#x2714; Ignored by git</text>
    <text x="22" y="148" class="step-desc" font-weight="600" fill="#f85149">&#x2718; Tracked in git</text>
    <text x="22" y="170" font-size="9" fill="#8b949e">NEVER touched if</text>
    <text x="22" y="182" font-size="9" fill="#8b949e">tracked in repo!</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 518 125 L 532 125" class="arrow"/>
  <polygon points="532,121 538,125 532,129" class="arrow-head"/>

  <!-- Step 4 -->
  <g transform="translate(535, 20)" filter="url(#shadow)">
    <rect width="155" height="210" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#f0883e"/>
    <circle cx="28" cy="34" r="14" fill="#f0883e" fill-opacity="0.15"/>
    <text x="28" y="38" text-anchor="middle" class="step-badge" style="fill:#f0883e;">04</text>
    <text x="50" y="38" class="step-title">Tier &amp; Lock</text>
    <text x="14" y="70" class="step-desc">Checks reproducibility</text>
    <text x="14" y="86" class="step-desc">and assigns tier:</text>
    <rect x="14" y="100" width="127" height="92" rx="6" fill="#1c2128"/>
    <rect x="22" y="112" width="56" height="18" rx="4" fill="#238636" fill-opacity="0.3"/>
    <text x="50" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#3fb950">SAFE</text>
    <rect x="22" y="137" width="68" height="18" rx="4" fill="#9e6a03" fill-opacity="0.3"/>
    <text x="56" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#d29922">REBUILD</text>
    <rect x="22" y="162" width="60" height="18" rx="4" fill="#bd561d" fill-opacity="0.3"/>
    <text x="52" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#f0883e">HEAVY</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 693 125 L 707 125" class="arrow"/>
  <polygon points="707,121 713,125 707,129" class="arrow-head"/>

  <!-- Step 5 -->
  <g transform="translate(710, 20)" filter="url(#shadow)">
    <rect width="160" height="210" rx="10" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="4" rx="2" fill="url(#accentGrad)"/>
    <circle cx="28" cy="34" r="14" fill="#2dd4bf" fill-opacity="0.2"/>
    <text x="28" y="38" text-anchor="middle" class="step-badge">05</text>
    <text x="50" y="38" class="step-title">Stage &amp; Purge</text>
    <text x="14" y="70" class="step-desc">1. Atomic stage rename</text>
    <text x="24" y="86" font-family="monospace" font-size="9" fill="#2dd4bf">*.devclean-trash</text>
    <rect x="14" y="100" width="132" height="92" rx="6" fill="#1c2128"/>
    <text x="20" y="120" font-size="10" font-weight="600" fill="#e6edf3">&#x2714; Instant metadata op</text>
    <text x="20" y="140" font-size="10" font-weight="600" fill="#e6edf3">&#x2714; Parallel Rayon purge</text>
    <text x="20" y="160" font-size="10" font-weight="600" fill="#e6edf3">&#x2714; Long paths (\\?\)</text>
    <text x="20" y="180" font-size="10" font-weight="600" fill="#e6edf3">&#x2714; Locked files skipped</text>
  </g>
</svg>